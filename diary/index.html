<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Личный дневник Азбука Я</title>
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('azbuka-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
    </script>
    <style>
      html { --app-bg: #2B0A0A; }
      html[data-theme='light'] { --app-bg: #F4ECDF; }
      html, body {
        background-color: var(--app-bg);
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
        background-color: var(--app-bg);
      }
    </style>
    <!-- Копия с telegram.org: в РФ его домены замедляют. Обновляется workflow update-telegram-sdk -->
    <script src="/telegram-web-app.js"></script>
    <script>
      // Инициализация и безопасный мок для Telegram WebApp
      (function() {
        if (!window.Telegram) {
          window.Telegram = {};
        }
        if (!window.Telegram.WebApp) {
          window.Telegram.WebApp = {
            ready: function() {},
            expand: function() {},
            close: function() {},
            setBackgroundColor: function() {},
            setHeaderColor: function() {},
            enableClosingConfirmation: function() {},
            initData: "",
            initDataUnsafe: {}
          };
        } else {
          var tg = window.Telegram.WebApp;
          try {
            tg.ready();
            tg.expand();
            if (typeof tg.setBackgroundColor === 'function') {
              tg.setBackgroundColor(document.documentElement.dataset.theme === 'light' ? '#F4ECDF' : '#2B0A0A');
            }
            if (typeof tg.setHeaderColor === 'function') {
              tg.setHeaderColor(document.documentElement.dataset.theme === 'light' ? '#F4ECDF' : '#2B0A0A');
            }
          } catch (e) {
            console.error("Error initializing Telegram WebApp", e);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
