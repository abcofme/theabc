<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Личный дневник Азбука Я</title>
    <meta name="description" content="Личный дневник, психологические тесты и отчеты о себе" />
    <!-- Установка на главный экран: Android и Chrome берут manifest, iOS — теги apple-* -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3B1819" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Азбука Я" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('azbuka-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
    </script>
    <style>
      html { --app-bg: #3B1819; }
      html[data-theme='light'] { --app-bg: #E6D0AD; }
      html, body {
        background-color: var(--app-bg);
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
        background-color: var(--app-bg);
      }
    </style>
    <!-- Копия с telegram.org: в РФ его домены замедляют. Обновляется workflow update-telegram-sdk -->
    <script src="/telegram-web-app.js"></script>
    <script>
      // Инициализация и безопасный мок для Telegram WebApp
      (function() {
        if (!window.Telegram) {
          window.Telegram = {};
        }
        if (!window.Telegram.WebApp) {
          window.Telegram.WebApp = {
            ready: function() {},
            expand: function() {},
            close: function() {},
            setBackgroundColor: function() {},
            setHeaderColor: function() {},
            enableClosingConfirmation: function() {},
            initData: "",
            initDataUnsafe: {}
          };
        } else {
          var tg = window.Telegram.WebApp;
          try {
            tg.ready();
            tg.expand();
            if (typeof tg.setBackgroundColor === 'function') {
              tg.setBackgroundColor(document.documentElement.dataset.theme === 'light' ? '#E6D0AD' : '#3B1819');
            }
            if (typeof tg.setHeaderColor === 'function') {
              tg.setHeaderColor(document.documentElement.dataset.theme === 'light' ? '#E6D0AD' : '#3B1819');
            }
          } catch (e) {
            console.error("Error initializing Telegram WebApp", e);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
