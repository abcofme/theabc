<!doctype html>
<html lang="ru" style="background-color: #68020D;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Личный дневник Азбука Я</title>
    <style>
      :root {
        --app-background: #68020D;
        --app-menu: #53020D;
      }
      html, body {
        background-color: var(--app-background) !important;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
        background-color: var(--app-background) !important;
      }
    </style>
    <!-- Копия с telegram.org: в РФ его домены замедляют. Обновляется workflow update-telegram-sdk -->
    <script src="/telegram-web-app.js"></script>
    <script>
      // Инициализация и безопасный мок для Telegram WebApp
      (function() {
        if (!window.Telegram) {
          window.Telegram = {};
        }
        if (!window.Telegram.WebApp) {
          window.Telegram.WebApp = {
            ready: function() {},
            expand: function() {},
            close: function() {},
            setBackgroundColor: function() {},
            setHeaderColor: function() {},
            enableClosingConfirmation: function() {},
            initData: "",
            initDataUnsafe: {}
          };
        } else {
          var tg = window.Telegram.WebApp;
          try {
            var theme = getComputedStyle(document.documentElement);
            var backgroundColor = theme.getPropertyValue('--app-background').trim();
            var menuColor = theme.getPropertyValue('--app-menu').trim();
            tg.ready();
            tg.expand();
            if (typeof tg.setBackgroundColor === 'function') {
              tg.setBackgroundColor(backgroundColor);
            }
            if (typeof tg.setHeaderColor === 'function') {
              tg.setHeaderColor(backgroundColor);
            }
            if (typeof tg.setBottomBarColor === 'function') {
              tg.setBottomBarColor(menuColor);
            }
          } catch (e) {
            console.error("Error initializing Telegram WebApp", e);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
