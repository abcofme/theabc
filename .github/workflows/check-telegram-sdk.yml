name: Check Telegram WebApp SDK

on:
  pull_request:
    paths:
      - '.github/workflows/check-telegram-sdk.yml'
      - '.github/workflows/update-telegram-sdk.yml'
      - 'diary/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diary
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: sha256sum --check telegram-web-app.sha256
      - run: node --check public/telegram-web-app.js
      - run: npm ci
      - run: npm test
      - run: npm run build
