# Вход в мини-апп через NL. Из РФ режут ответы московского сервера на адреса многих VPN,
# и у пользователей Telegram через VPN мини-апп падал с ERR_TIMED_OUT. Отсюда ответы доходят.
# TLS здесь не расшифровывается: байты уходят в Москву как есть, сертификат и данные — только там.
# Подключается в /etc/nginx/nginx.conf строкой `include /etc/nginx/stream.conf;` вне блока http
# (нужен пакет libnginx-mod-stream).
stream {
    # Ретранслятор Bot API (бот ходит по IP, без SNI) — только с московского сервера
    geo $tg_relay_upstream {
        default       blackhole;
        5.129.200.77  tg_relay;
    }

    map $ssl_preread_server_name $upstream_443 {
        abcofme.ru      theabc_msk_443;
        www.abcofme.ru  theabc_msk_443;
        app.abcofme.ru  theabc_msk_443;
        default         $tg_relay_upstream;
    }

    upstream theabc_msk_443 { server 5.129.200.77:443; }
    upstream tg_relay       { server 127.0.0.1:8443; }
    upstream blackhole      { server 127.0.0.1:1; }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $upstream_443;
        proxy_connect_timeout 10s;
        # Ответы ИИ идут потоком по несколько минут
        proxy_timeout 10m;
    }

    # HTTP: выпуск сертификатов Caddy (ACME http-01) и редирект на https — тоже в Москве
    server {
        listen 80;
        proxy_pass 5.129.200.77:80;
        proxy_connect_timeout 10s;
    }
}
