# Ретранслятор Telegram Bot API для бота theabc (сервер в Москве не видит api.telegram.org)
server {
    # Снаружи 443 принимает stream (nginx-stream.conf) и по SNI отдаёт сюда только трафик бота
    listen 127.0.0.1:8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/relay/cert.pem;
    ssl_certificate_key /etc/nginx/relay/key.pem;
    ssl_protocols TLSv1.3;

    # Доступ только с продакшен-сервера проверяет stream: сюда соединения приходят только от него
    allow 127.0.0.1;
    deny all;

    # Токен бота передаётся в URL — не пишем его в логи
    access_log off;

    client_max_body_size 50m;

    location ~ ^/(file/)?bot[0-9]+:[A-Za-z0-9_-]+/ {
        proxy_pass https://api.telegram.org;
        proxy_ssl_server_name on;
        proxy_set_header Host api.telegram.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
