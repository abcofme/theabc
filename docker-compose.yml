version: '3.8'
services:
  backend:
    build: .
    env_file: .env
    restart: always
    depends_on:
      - redis
    ports:
      - "8000:8000"

  redis:
    env_file: .env
    image: redis:7.2.2-alpine3.18
    restart: always
    command:
      - redis-server
      - --appendonly yes
      - --requirepass ${REDIS_PASSWORD}
      - --loglevel debug
    volumes:
      - redis-data:/data
    ports:
      - ${REDIS_PORT}:6379

volumes:
  redis-data: